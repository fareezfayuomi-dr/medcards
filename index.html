<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedCards - تطبيق الدراسة الذكي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="fa.css">
<script src="dexie.min.js"></script>
<style>
body{background:#121212;color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif}
canvas{touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body class="dark min-h-screen flex flex-col">

<header class="bg-cardbg border-b border-bordercolor p-4 flex justify-between items-center shadow-md">
  <div class="flex items-center gap-3">
    <i class="fa-solid fa-brain text-indigo-500 text-2xl"></i>
    <h1 class="text-xl font-bold">MedCards <span class="text-xs text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded-full border border-indigo-800">Pro</span></h1>
  </div>
  <div class="flex items-center gap-2">
    <button onclick="switchView('dashboard')" class="btn btn-p"><i class="fa-solid fa-layer-group ml-1"></i> الرُزم</button>
    <button onclick="switchView('stats')" class="btn"><i class="fa-solid fa-chart-pie ml-1"></i> الإحصائيات</button>
    <button onclick="exportData()" class="btn" title="تصدير نسخة احتياطية"><i class="fa-solid fa-download"></i></button>
    <label class="btn" title="استيراد نسخة احتياطية"><i class="fa-solid fa-upload"></i><input type="file" accept=".json" class="hidden" onchange="importData(this.files[0]);this.value=''"></label>
  </div>
</header>

<main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">

<section id="view-dashboard" class="space-y-5">
  <div class="flex justify-between items-center">
    <h2 class="text-lg font-semibold">المواد والمحاضرات الدراسية</h2>
    <button onclick="addSubject()" class="btn btn-p"><i class="fa-solid fa-plus ml-1"></i> إضافة مادة</button>
  </div>
  <div id="backup-note"></div>
  <div id="subjects-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
</section>

<section id="view-study" class="hidden space-y-4">
  <div class="flex justify-between items-center box !p-3">
    <button onclick="switchView('dashboard')" class="text-zinc-400 hover:text-white text-sm"><i class="fa-solid fa-arrow-right ml-1"></i> العودة</button>
    <div id="study-progress" class="text-sm font-medium text-indigo-400"></div>
  </div>
  <div class="box !p-6 min-h-[300px] shadow-xl">
    <div id="card-front" class="text-lg leading-relaxed"></div>
    <div id="card-back-box" class="hidden border-t border-bordercolor pt-4 mt-4">
      <div id="card-back" class="text-lg text-indigo-200 leading-relaxed"></div>
    </div>
    <div id="show-area" class="mt-6"><button onclick="showAnswer()" class="btn btn-p w-full !py-3">إظهار الجواب (Space)</button></div>
    <div id="rating" class="hidden grid-cols-4 gap-2 mt-6 pt-4 border-t border-bordercolor">
      <button onclick="rateCard(1)" class="btn bg-red-900/50 text-red-200 border border-red-700">إعادة (1)<div id="iv-1" class="text-[10px] opacity-70 mt-0.5"></div></button>
      <button onclick="rateCard(2)" class="btn bg-amber-900/50 text-amber-200 border border-amber-700">صعب (2)<div id="iv-2" class="text-[10px] opacity-70 mt-0.5"></div></button>
      <button onclick="rateCard(3)" class="btn bg-emerald-900/50 text-emerald-200 border border-emerald-700">جيد (3)<div id="iv-3" class="text-[10px] opacity-70 mt-0.5"></div></button>
      <button onclick="rateCard(4)" class="btn bg-blue-900/50 text-blue-200 border border-blue-700">سهل (4)<div id="iv-4" class="text-[10px] opacity-70 mt-0.5"></div></button>
    </div>
  </div>
</section>

<section id="view-editor" class="hidden space-y-5">
  <div class="flex justify-between items-center box !p-3">
    <button onclick="switchView('dashboard')" class="text-zinc-400 hover:text-white text-sm"><i class="fa-solid fa-arrow-right ml-1"></i> إغلاق المحرر</button>
    <h3 id="editor-title" class="font-bold text-indigo-400"></h3>
  </div>
  <div class="box space-y-5">
    <h4 id="form-title" class="font-semibold text-sm text-zinc-300">إضافة بطاقة جديدة</h4>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="space-y-2">
        <div class="text-xs text-zinc-400">الوجه الأمامي (السؤال)</div>
        <textarea id="new-front" rows="2" dir="auto" class="inp" placeholder="نص السؤال (اختياري إذا رسمت)..."></textarea>
        <div id="bar-f"></div>
        <canvas id="pad-f" width="1200" height="600" class="pad"></canvas>
      </div>
      <div class="space-y-2">
        <div class="text-xs text-zinc-400">الوجه الخلفي (الجواب)</div>
        <textarea id="new-back" rows="2" dir="auto" class="inp" placeholder="نص الجواب (اختياري إذا رسمت)..."></textarea>
        <div id="bar-b"></div>
        <canvas id="pad-b" width="1200" height="600" class="pad"></canvas>
      </div>
    </div>
    <div class="flex gap-2">
      <button id="save-btn" onclick="saveCard()" class="btn btn-p flex-1 !py-2.5">حفظ البطاقة وإضافتها</button>
      <button id="cancel-btn" onclick="resetForm()" class="btn hidden">إلغاء التعديل</button>
    </div>
  </div>
  <div class="space-y-2">
    <h4 class="font-semibold text-sm text-zinc-300">الكروت الحالية في هذه المحاضرة</h4>
    <div id="lecture-cards-list" class="space-y-2"></div>
  </div>
</section>

<section id="view-stats" class="hidden">
  <div class="box !p-6 text-center space-y-4">
    <h3 class="text-lg font-bold">إحصائيات المراجعة والنشاط</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-2">
      <div class="bg-zinc-900 p-4 rounded-xl border border-bordercolor"><div id="st-total" class="text-2xl font-bold text-indigo-400">0</div><div class="text-xs text-zinc-400 mt-1">إجمالي الكروت</div></div>
      <div class="bg-zinc-900 p-4 rounded-xl border border-bordercolor"><div id="st-due" class="text-2xl font-bold text-amber-400">0</div><div class="text-xs text-zinc-400 mt-1">مستحقة الآن</div></div>
      <div class="bg-zinc-900 p-4 rounded-xl border border-bordercolor"><div id="st-today" class="text-2xl font-bold text-emerald-400">0</div><div class="text-xs text-zinc-400 mt-1">مراجعات اليوم</div></div>
      <div class="bg-zinc-900 p-4 rounded-xl border border-bordercolor"><div id="st-all" class="text-2xl font-bold text-blue-400">0</div><div class="text-xs text-zinc-400 mt-1">كل المراجعات</div></div>
    </div>
    <button onclick="resetProgress()" class="btn btn-d mt-4"><i class="fa-solid fa-rotate-left ml-1"></i> إعادة التقدم من الصفر</button>
    <div class="text-xs text-zinc-500">يصفّر الإحصائيات وجدولة المراجعة لكل الكروت. الكروت نفسها ما بتنحذف.</div>
  </div>
</section>

</main>

<script>
const db = new Dexie("MedCardsDatabase");
db.version(1).stores({
  subjects: '++id, name',
  lectures: '++id, subjectId, name',
  cards: '++id, lectureId, front, back, drawing, interval, repetition, easeFactor, dueDate',
  reviews: '++id, date'
});
db.version(2).stores({
  subjects: '++id, name',
  lectures: '++id, subjectId, name',
  cards: '++id, lectureId, dueDate, fbg, bbg, fd, bd',
  reviews: '++id, date'
});

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO = () => new Date().toISOString();
const today = () => new Date().toLocaleDateString('sv');
const isDue = c => !c.dueDate || c.dueDate <= nowISO();
let view = 'dashboard', lecId = null, editId = null, cards = [], ci = 0;

function seg(x, st, i) {
  const p = st.p; x.strokeStyle = st.c; x.lineWidth = st.w * (.4 + p[i][2] * 1.2);
  x.beginPath(); x.moveTo(p[i-1][0], p[i-1][1]); x.lineTo(p[i][0], p[i][1]); x.stroke();
}
function paint(x, s, bg) {
  x.clearRect(0, 0, 1200, 600);
  if (bg) x.drawImage(bg, 0, 0, 1200, 600);
  x.lineCap = x.lineJoin = 'round';
  for (const st of s) {
    const p = st.p;
    if (p.length == 1) { x.fillStyle = st.c; x.beginPath(); x.arc(p[0][0], p[0][1], st.w * (.4 + p[0][2] * 1.2) / 2, 0, 7); x.fill(); continue; }
    for (let i = 1; i < p.length; i++) seg(x, st, i);
  }
}
function Pad(id) {
  const c = $(id), x = c.getContext('2d');
  const p = { s: [], bg: null, bgData: '', color: '#ffffff', size: 3, er: false, h: [], r: [] };
  let cur = null, erasing = false, ty = null;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  const cap = () => ({ s: JSON.stringify(p.s), b: p.bgData });
  const snap = () => { p.h.push(cap()); if (p.h.length > 50) p.h.shift(); p.r = []; };
  const erase = e => { const [a, b] = pos(e), r = p.size * 4 + 12; p.s = p.s.filter(st => !st.p.some(q => Math.hypot(q[0] - a, q[1] - b) < r)); };
  p.draw = () => paint(x, p.s, p.bg);
  c.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') { ty = e.clientY; return; }
    e.preventDefault(); c.setPointerCapture(e.pointerId);
